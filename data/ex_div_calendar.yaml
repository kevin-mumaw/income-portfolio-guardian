# Manually-maintained ex-dividend calendar.
#
# WEEKLY funds (YieldMax-style) use ex_weekday instead of a fixed date --
# purchase_timing.py computes the next actual occurrence automatically,
# so this never goes stale. Nothing to update week to week.
#
# MONTHLY/QUARTERLY funds still use next_ex_date, since their ex-date
# doesn't follow a fixed day-of-week pattern -- these genuinely need a
# manual update after each cycle. purchase_timing.py now flags any date
# that's already in the past instead of silently displaying it as if
# it were still upcoming.

holdings:
  - symbol: VOO
    account: roth
    frequency: quarterly
    next_ex_date: "2026-12-22"   # ESTIMATE (late Dec; Vanguard announces 1-2 wks ahead) -- confirm at investor.vanguard.com

  - symbol: YMAX
    account: roth
    frequency: weekly
    ex_weekday: Wednesday   # pay Thursday -- confirmed via marketchameleon.com

  - symbol: AMDY
    account: roth
    frequency: weekly
    ex_weekday: Thursday    # pay Friday -- Group 2, confirmed via dripcalc.com

  - symbol: MRNY
    account: roth
    frequency: weekly
    ex_weekday: Thursday    # pay Friday -- Group 2, same as AMDY, confirmed via dripcalc.com

  - symbol: QQQI
    account: roth
    frequency: monthly
    next_ex_date: "2026-10-21"   # confirmed on neosfunds.com/qqqi (pay 10/23); then 11/18, 12/16

  - symbol: QQQI
    account: traditional
    frequency: monthly
    next_ex_date: "2026-10-21"   # same fund as Roth QQQI entry; confirmed on neosfunds.com/qqqi

  - symbol: SPYI
    account: roth
    frequency: monthly
    next_ex_date: "2026-10-21"   # confirmed on neosfunds.com/spyi (pay 10/23); then 11/18, 12/16