# Single source of truth for tier targets and fund->tier mapping.
# Edit this file when you add/remove a holding or change target %s.
# tier_drift.py reads this directly -- no need to touch the script
# to rebalance targets or reclassify a fund.
#
# Holdings are a list, not a dict keyed by symbol, because the same
# ticker can legitimately sit in more than one account (e.g. YMAX in
# both taxable and Roth) with different intent/status per position.

targets:
  tier_1: 0.25   # capital preservation / stability anchor -- lowered from 37.5%; on a
                 # 3-4yr no-current-income-need horizon, stability matters less than
                 # maximizing eventual income, so VOO gets a smaller share of new capital
  tier_2: 0.65   # diversified weekly/monthly option-premium income -- primary growth
                 # engine for this horizon (real total-return track record, e.g. SPYI)
  tier_3: 0.10   # max instant cash flow / highest decay risk -- deliberately minimized,
                 # not zeroed; existing MSTY/CONY shares keep harvesting, but new capital
                 # is better spent compounding in Tier 2 than adding more decay-prone shares

holdings:
  - symbol: VOO
    tier: 1
    account: roth
    sub_weight: 1.00  # only Tier 1 holding

  - symbol: YMAX
    tier: 2
    account: roth
    sub_weight: 0.20  # per-tier share of new Tier 2 capital -- see DECISIONS.md

  - symbol: CONY
    tier: 3
    account: roth
    sub_weight: 1.00  # only Tier 3 holding remaining after MSTY sold Sept 2026 -- see DECISIONS.md

  - symbol: XYLD
    tier: 2                # diversified S&P 500 covered call -- corrected from Tier 3
                            # (leftover from early proposal stage; actual usage has
                            # treated it as Tier 2 throughout, matching the spreadsheet)
    account: roth
    sub_weight: 0.25  # per-tier share of new Tier 2 capital -- see DECISIONS.md

  - symbol: SPYI
    tier: 2                # diversified S&P 500 covered call, Section 1256 tax treatment
    account: roth
    sub_weight: 0.55  # per-tier share of new Tier 2 capital -- see DECISIONS.md

# Not currently held -- tracked here so tier placement is decided
# in advance, before capital moves (see rollover_calc.py, planned).
watchlist:
  - symbol: GOF
    proposed_tier: 2   # leveraged credit CEF -- Tier 2, not Tier 1, see DECISIONS.md
  - symbol: PDI
    proposed_tier: 2   # leveraged credit CEF -- Tier 2, not Tier 1, see DECISIONS.md
  - symbol: FEPI
    proposed_tier: 2
  - symbol: STK
    proposed_tier: 2   # tech CEF, 2026 distributions 100% realized cap gains, not ROC
  - symbol: IDVO
    proposed_tier: 2   # international diversification, covered call
  - symbol: JEPI
    proposed_tier: 2   # diversified S&P 500, selective ELN overlay, lower cap on upside than XYLD
  - symbol: DIVO
    proposed_tier: 2   # blue-chip dividend payers, tactical covered calls, lower tech weight
  - symbol: PFFA
    proposed_tier: 2   # preferred stock income, financials/utilities heavy, non-equity diversifier
  - symbol: ARCC
    proposed_tier: 2   # BDC, real earnings coverage, no options overlay
  - symbol: MAIN
    proposed_tier: 2   # BDC, real earnings coverage, monthly + supplemental div
  - symbol: UTG
    proposed_tier: 1   # utility CEF, lower volatility, Tier 1/2 boundary candidate
  - symbol: RYLD
    proposed_tier: 3   # sold from active holdings Aug 2026 -- diversification candidate if revisited
  - symbol: GPTY
    proposed_tier: 3   # AI/tech, call-spread (not full covered call) keeps upside -- +35.46% 1yr total return, 51.29% ROC (much healthier than MSTY/CONY's 96-99%)
  - symbol: NVDY
    proposed_tier: 3   # single-stock NVDA covered call -- 94% ROC like MSTY/CONY, but +30.83% 1yr / +58.76%/yr since inception (positive, unlike MSTR/COIN's collapse) -- evidence high ROC isn't disqualifying alone, weak underlying is the real issue
  - symbol: AIPI
    proposed_tier: 2   # diversified AI-stock covered calls -- +20.01% 1yr total return, ~33-35% yield, less concentrated single-name risk than GPTY/NVDY

decay_warning_rule:
  roc_pct_threshold: 0.90
  consecutive_periods: 3
  require_concurrent_price_decline: true