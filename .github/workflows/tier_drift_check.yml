name: Weekly tier drift check

# Runs the tier drift monitor on a schedule once tier_drift.py's
# get_live_positions() is wired to the Schwab client. Currently a
# manual-trigger-only scaffold -- enable the schedule once secrets
# (Schwab token refresh) are set up, matching the options-bot pattern.

on:
  workflow_dispatch: {}
  # schedule:
  #   - cron: '0 13 * * 1'   # Mondays 9am ET, uncomment once live

jobs:
  drift-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tier drift monitor
        run: python screener/tier_drift.py
        # env:
        #   SCHWAB_TOKEN: ${{ secrets.SCHWAB_TOKEN }}
